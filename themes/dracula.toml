# g — built-in theme: dracula
# Vivid colors on a dark background.
name = "dracula"

border_style = "rounded"  # soft rounded corners suit the vivid palette
density      = "normal"

[palette]
primary  = "#8be9fd"
success  = "#50fa7b"
warning  = "#f1fa8c"
danger   = "#ff5555"
muted    = "#6272a4"
text     = "#f8f8f2"
accent   = "#bd93f9"
divider  = "#6272a4"

cc_feat     = "#50fa7b"
cc_fix      = "#ff5555"
cc_docs     = "#8be9fd"
cc_refactor = "#bd93f9"
cc_perf     = "#ffb86c"
cc_test     = "#8be9fd"
cc_chore    = "#6272a4"
cc_revert   = "#ff5555"

# Syntax highlighting
syntax_keyword   = "#ff79c6"
syntax_string    = "#f1fa8c"
syntax_comment   = "#6272a4"
syntax_function  = "#50fa7b"
syntax_type      = "#8be9fd"
syntax_number    = "#bd93f9"
syntax_operator  = "#ff79c6"
syntax_variable  = "#f8f8f2"
syntax_constant  = "#bd93f9"
syntax_attribute = "#50fa7b"

# Diff colors
diff_add_bg = "#1a3a1a"
diff_del_bg = "#3a1a1a"
diff_hunk   = "#6272a4"
